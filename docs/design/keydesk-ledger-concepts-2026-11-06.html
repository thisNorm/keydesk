<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Keydesk · 목록 구조 검토</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fff;
        color: #151515;
        font:
          14px/1.6 -apple-system,
          BlinkMacSystemFont,
          'Apple SD Gothic Neo',
          'Malgun Gothic',
          'Noto Sans CJK KR',
          sans-serif;
        letter-spacing: -0.25px;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 2px solid #111;
        outline-offset: 4px;
      }
      button,
      input,
      select {
        border-radius: 0;
      }
      button {
        background: transparent;
      }
      button:disabled {
        cursor: default;
      }
      .concept {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 9px 34px;
        border-bottom: 1px solid #aaa;
        font-size: 10px;
        color: #555;
        background: #fff;
      }
      .concept-options {
        display: flex;
        gap: 20px;
      }
      .concept button {
        padding: 0;
        border: 0;
        font-size: 11px;
        color: #555;
      }
      .concept button.active {
        text-decoration: underline;
        text-underline-offset: 4px;
        color: #111;
      }
      .top {
        height: 82px;
        display: flex;
        align-items: center;
        gap: 70px;
        padding: 0 46px;
        border-bottom: 1px solid #161616;
      }
      .brand {
        font:
          700 26px/1 Arial,
          sans-serif;
        letter-spacing: -1.5px;
      }
      .brand small {
        font:
          400 10px/1.5 Consolas,
          monospace;
        letter-spacing: 0;
        margin-left: 13px;
        color: #666;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 28px;
        height: 100%;
      }
      .nav button {
        border: 0;
        font-size: 13px;
        padding: 0;
      }
      .nav button.current {
        font-weight: 650;
        text-decoration: underline;
        text-underline-offset: 7px;
      }
      .account {
        margin-left: auto;
        display: flex;
        gap: 24px;
        align-items: center;
        font-size: 12px;
      }
      .text-button {
        border: 0;
        padding: 0;
        background: transparent;
        font-size: 12px;
      }
      .quiet {
        color: #666;
      }
      .page {
        max-width: 1600px;
        margin: auto;
        padding: 36px 46px 24px;
      }
      .heading {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 20px;
        margin-bottom: 27px;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -1px;
        font-weight: 650;
        line-height: 1.3;
        margin: 0;
      }
      .heading small {
        font-size: 11px;
        color: #666;
      }
      .tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
        padding-bottom: 18px;
      }
      .filters {
        display: flex;
        align-items: center;
        gap: 23px;
      }
      .filters select {
        background: #fff;
        border: 0;
        padding: 0;
        color: #111;
        font-size: 12px;
        max-width: 140px;
      }
      .filter {
        border: 0;
        padding: 0;
        font-size: 12px;
        color: #666;
        white-space: nowrap;
      }
      .filter.active {
        color: #111;
        text-decoration: underline;
        text-underline-offset: 5px;
      }
      .find-actions {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .search {
        display: flex;
        align-items: center;
        border-bottom: 1px solid #666;
        width: 224px;
        gap: 10px;
        padding-bottom: 4px;
      }
      .search input {
        width: 100%;
        min-width: 0;
        outline: none;
        border: 0;
        padding: 0;
        font-size: 12px;
        background: transparent;
        color: #111;
      }
      .search input::placeholder {
        color: #666;
      }
      .search kbd {
        font: 10px/1.4 inherit;
        white-space: nowrap;
        color: #666;
      }
      .add {
        border: 1px solid #161616;
        padding: 5px 12px;
        font-size: 12px;
        min-height: 31px;
      }
      .import {
        font-size: 12px;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      .table th {
        font-size: 11px;
        font-weight: 400;
        color: #555;
        text-align: left;
        padding: 11px 0;
        border-top: 1px solid #111;
        border-bottom: 1px solid #111;
      }
      .table .n {
        width: 43px;
        color: #777;
        font:
          11px/1.6 Consolas,
          monospace;
      }
      .table .name {
        width: 27%;
      }
      .table .usage {
        width: 29%;
      }
      .table .count {
        width: 76px;
      }
      .table .expiry {
        width: 180px;
      }
      .table .open {
        width: 27px;
        text-align: right;
      }
      .table .summary td {
        height: 65px;
        padding: 11px 0;
        border-bottom: 1px solid #ccc;
        vertical-align: middle;
      }
      .name-button {
        padding: 0;
        border: 0;
        font-weight: 600;
        font-size: 15px;
        letter-spacing: -0.4px;
      }
      .selected .name-button {
        text-decoration: underline;
        text-underline-offset: 5px;
      }
      .table .summary.selected td {
        border-bottom-color: #111;
      }
      .entry-purpose {
        color: #666;
        font-size: 11px;
        display: block;
        margin-top: 3px;
      }
      .use-name {
        font-size: 13px;
      }
      .count {
        font-size: 12px;
      }
      .date {
        font:
          13px/1.5 Consolas,
          monospace;
        letter-spacing: 0;
      }
      .remaining {
        font-size: 11px;
        color: #666;
        display: block;
        margin-top: 3px;
      }
      .expired .date,
      .expired .remaining {
        color: #aa2525;
      }
      .open button {
        border: 0;
        font:
          20px/1 Consolas,
          monospace;
        padding: 8px 0 8px 8px;
      }
      .detail-row td {
        padding: 0;
        border-bottom: 1px solid #111;
      }
      .sheet {
        padding: 18px 27px 23px 43px;
        background: #fff;
      }
      .sheet-head {
        display: flex;
        justify-content: space-between;
        gap: 25px;
        align-items: center;
        margin-bottom: 12px;
        font-size: 12px;
      }
      .sheet-head .quiet {
        font-size: 11px;
      }
      .sheet-actions {
        display: flex;
        gap: 22px;
      }
      .sheet-actions button {
        border: 0;
        padding: 0;
        font-size: 11px;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .key-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      .key-table th {
        font-size: 10px;
        padding: 7px 0;
        color: #666;
        border: 0;
        font-weight: 400;
        text-align: left;
      }
      .key-table td {
        font-size: 12px;
        padding: 9px 0;
        border: 0;
        border-top: 1px solid #d5d5d5;
        vertical-align: middle;
      }
      .key-table .label {
        width: 160px;
      }
      .key-table .value {
        width: auto;
      }
      .key-table .key-date {
        width: 180px;
      }
      .key-table .key-actions {
        width: 130px;
        text-align: right;
      }
      .masked {
        font:
          13px/1.6 Consolas,
          monospace;
        letter-spacing: 2px;
      }
      .key-table button {
        font-size: 11px;
        border: 0;
        padding: 0;
        margin-left: 19px;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .key-table .key-date {
        font:
          12px/1.6 Consolas,
          monospace;
      }
      .sheet-note {
        font-size: 11px;
        color: #555;
        margin-top: 16px;
        display: flex;
        justify-content: space-between;
        gap: 20px;
      }
      .sheet-note details {
        max-width: 70%;
      }
      .sheet-note summary {
        cursor: pointer;
      }
      .sheet-note p {
        margin: 7px 0 0;
      }
      .list-end {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        font-size: 10px;
        color: #666;
        padding-top: 15px;
      }
      .empty {
        padding: 40px 0;
        text-align: center;
        font-size: 12px;
        color: #666;
      }
      .bottom-detail {
        display: none;
      }
      .split .detail-row {
        display: none;
      }
      .split .summary td {
        height: 48px;
        padding: 7px 0;
      }
      .split .entry-purpose {
        display: none;
      }
      .split .bottom-detail {
        display: block;
        border-top: 1px solid #111;
        margin-top: 24px;
      }
      .split .bottom-detail .sheet {
        padding-left: 43px;
        padding-right: 27px;
        padding-top: 16px;
      }
      .split .bottom-detail .sheet-head strong {
        font-size: 16px;
        letter-spacing: -0.5px;
      }
      .toast {
        position: fixed;
        bottom: 20px;
        right: 30px;
        border: 1px solid #111;
        background: #fff;
        padding: 10px 15px;
        z-index: 10;
        font-size: 12px;
        max-width: calc(100vw - 30px);
      }
      [hidden] {
        display: none !important;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid #ccc;
        margin-top: 36px;
        padding-top: 13px;
        font-size: 10px;
        color: #666;
      }
      .mobile-count {
        display: none;
      }
      @media (min-width: 1600px) {
        .page {
          padding-top: 42px;
        }
        .table .summary td {
          height: 69px;
        }
      }
      @media (max-width: 1100px) {
        .top {
          gap: 40px;
          padding-left: 30px;
          padding-right: 30px;
        }
        .brand small {
          display: none;
        }
        .page {
          padding-left: 30px;
          padding-right: 30px;
        }
        .nav {
          gap: 23px;
        }
        .table .name {
          width: 26%;
        }
        .table .usage {
          width: 27%;
        }
        .table .expiry {
          width: 150px;
        }
        .key-table .key-date {
          width: 150px;
        }
        .key-table .label {
          width: 130px;
        }
        .account {
          gap: 16px;
        }
      }
      @media (max-width: 780px) {
        .top {
          gap: 25px;
        }
        .nav {
          gap: 18px;
        }
        .nav button:nth-child(n + 3) {
          display: none;
        }
        .account .owner {
          display: none;
        }
        .heading {
          margin-bottom: 22px;
        }
        .tools {
          align-items: start;
        }
        .filters {
          gap: 18px;
        }
        .find-actions {
          gap: 15px;
        }
        .import {
          display: none;
        }
        .search {
          width: 170px;
        }
        .table .count {
          width: 45px;
        }
        .table .usage {
          width: 24%;
        }
        .sheet {
          padding-left: 25px;
          padding-right: 0;
        }
        .key-table .label {
          width: 100px;
        }
        .key-table .key-date {
          width: 120px;
        }
        .key-table .key-actions {
          width: 105px;
        }
        .key-table button {
          margin-left: 13px;
        }
      }
      @media (max-width: 550px) {
        .concept {
          padding: 9px 18px;
        }
        .concept > span {
          display: none;
        }
        .concept-options {
          gap: 23px;
        }
        .top {
          height: 70px;
          padding: 0 19px;
          gap: 25px;
        }
        .brand {
          font-size: 24px;
        }
        .nav {
          gap: 17px;
        }
        .nav button {
          font-size: 12px;
        }
        .nav button:nth-child(n + 2) {
          display: none;
        }
        .account {
          gap: 12px;
          font-size: 11px;
        }
        .account button {
          font-size: 11px;
        }
        .page {
          padding: 27px 19px 20px;
        }
        .heading {
          gap: 15px;
          align-items: end;
          margin-bottom: 23px;
        }
        h1 {
          font-size: 25px;
        }
        .heading small {
          font-size: 10px;
        }
        .tools {
          gap: 18px;
          align-items: stretch;
          flex-direction: column;
          padding-bottom: 17px;
        }
        .filters {
          gap: 25px;
        }
        .filters select {
          font-size: 12px;
          max-width: 120px;
        }
        .filter {
          font-size: 11px;
        }
        .find-actions {
          justify-content: space-between;
          gap: 18px;
        }
        .search {
          flex: 1;
          width: auto;
          max-width: 230px;
        }
        .search input {
          font-size: 12px;
        }
        .search kbd {
          font-size: 9px;
        }
        .add {
          font-size: 11px;
          min-height: 30px;
          padding: 4px 9px;
        }
        .table .n {
          width: 26px;
          font-size: 10px;
        }
        .table .name {
          width: auto;
        }
        .table .usage,
        .table .count {
          display: none;
        }
        .table .expiry {
          width: 113px;
        }
        .table .open {
          width: 22px;
        }
        .table th {
          font-size: 10px;
          padding: 10px 0;
        }
        .table .summary td {
          height: 69px;
          padding: 13px 0;
        }
        .name-button {
          font-size: 14px;
        }
        .entry-purpose {
          font-size: 10px;
          margin-top: 4px;
        }
        .date {
          font-size: 11px;
        }
        .remaining {
          font-size: 10px;
        }
        .sheet {
          padding: 16px 0 21px 26px;
        }
        .sheet-head {
          align-items: start;
          gap: 15px;
        }
        .sheet-head .quiet {
          font-size: 10px;
        }
        .sheet-actions {
          gap: 15px;
          white-space: nowrap;
        }
        .sheet-actions button {
          font-size: 10px;
        }
        .key-table {
          table-layout: auto;
        }
        .key-table thead {
          display: none;
        }
        .key-table tbody {
          display: grid;
        }
        .key-table tr {
          display: grid;
          grid-template-columns: 1fr auto;
          align-items: center;
          gap: 9px 12px;
          padding: 13px 0;
          border-top: 1px solid #ccc;
        }
        .key-table td {
          display: block;
          border: 0;
          padding: 0;
        }
        .key-table .label {
          width: auto;
          font-size: 13px;
          font-weight: 500;
        }
        .key-table .key-date {
          width: auto;
          font-size: 11px;
          justify-self: end;
        }
        .key-table .value {
          grid-column: 1;
          grid-row: 2;
          min-width: 0;
        }
        .key-table .key-actions {
          width: auto;
          grid-column: 2;
          grid-row: 2;
          white-space: nowrap;
        }
        .masked {
          font-size: 12px;
          letter-spacing: 1px;
        }
        .key-table button {
          font-size: 11px;
          margin-left: 15px;
        }
        .sheet-note {
          display: block;
          font-size: 10px;
          margin-top: 12px;
        }
        .sheet-note details {
          max-width: 100%;
        }
        .sheet-note > span {
          display: none;
        }
        .list-end {
          font-size: 9px;
          line-height: 1.8;
        }
        .list-end span:last-child {
          display: none;
        }
        .footer {
          font-size: 9px;
          margin-top: 28px;
        }
        .footer span:last-child {
          display: none;
        }
        .split .summary td {
          height: 55px;
        }
        .split .entry-purpose {
          display: block;
        }
        .split .bottom-detail .sheet {
          padding-left: 0;
          padding-right: 0;
        }
        .split .bottom-detail .sheet-head strong {
          font-size: 15px;
        }
      }
      @media (max-width: 550px) {
        .table,
        .table > thead,
        .table > tbody {
          display: block;
          width: 100%;
        }
        .table > thead > tr,
        .table > tbody > .summary {
          display: grid;
          grid-template-columns: 26px minmax(0, 1fr) 113px 22px;
          width: 100%;
          align-items: center;
        }
        .table > thead > tr {
          border-top: 1px solid #111;
          border-bottom: 1px solid #111;
        }
        .table > thead > tr > th {
          display: block;
          width: auto;
          min-width: 0;
          border: 0;
        }
        .table > tbody > .summary {
          border-bottom: 1px solid #ccc;
          min-height: 69px;
        }
        .table > tbody > .summary.selected {
          border-bottom-color: #111;
        }
        .table > tbody > .summary > td {
          display: block;
          height: auto;
          width: auto;
          min-width: 0;
          border: 0;
        }
        .table > thead > tr > .usage,
        .table > thead > tr > .count,
        .table > tbody > .summary > .usage,
        .table > tbody > .summary > .count {
          display: none;
        }
        .table > tbody > .detail-row,
        .table > tbody > .detail-row > td {
          display: block;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="concept">
      <div class="concept-options" aria-label="목록 구조 비교">
        <button type="button" data-layout="inline" class="active">행 아래에서 펼치기</button
        ><button type="button" data-layout="split">목록 아래에서 보기</button>
      </div>
      <span>구조 검토용 시안 · 예시 데이터</span>
    </div>
    <div class="app" id="app">
      <header class="top">
        <div class="brand">keydesk<small>Norm</small></div>
        <nav class="nav" aria-label="메뉴">
          <button type="button" class="current">보관함</button
          ><button type="button" data-demo="프로젝트별 사용 키를 확인하는 화면입니다.">
            프로젝트</button
          ><button type="button" data-demo="키 만료 알림을 확인하는 화면입니다.">알림</button
          ><button type="button" data-demo="향후 서버 중계·사용량 설정으로 이어집니다.">
            서버
          </button>
        </nav>
        <div class="account">
          <span class="owner quiet">개인 보관함</span
          ><button type="button" class="text-button" data-demo="설정·백업·복원으로 이어집니다.">
            설정</button
          ><button type="button" class="text-button" id="lock">잠금</button>
        </div>
      </header>
      <main class="page">
        <header class="heading">
          <h1>보관함</h1>
          <small id="total">8개 항목 / 인증값 12개</small>
        </header>
        <div class="tools">
          <div class="filters">
            <select aria-label="프로젝트" id="project">
              <option value="all">모든 프로젝트</option>
              <option>Pinmate</option>
              <option>Keydesk</option>
              <option>사진 정리</option>
              <option>홈서버</option></select
            ><button type="button" class="filter active" data-filter="all">전체</button
            ><button type="button" class="filter" data-filter="soon">30일 이내</button
            ><button type="button" class="filter" data-filter="expired">만료됨</button>
          </div>
          <div class="find-actions">
            <label class="search"
              ><input
                id="search"
                aria-label="키 검색"
                placeholder="이름·제공사·사용처 검색"
                autocomplete="off"
              /><kbd id="shortcut">Ctrl K</kbd></label
            ><button
              type="button"
              class="text-button import"
              data-demo=".env 파일의 항목을 확인한 뒤 가져옵니다."
            >
              가져오기</button
            ><button
              type="button"
              class="add"
              data-demo="이름·인증값을 먼저 입력하는 별도 등록 화면으로 이어집니다."
            >
              + 키 추가
            </button>
          </div>
        </div>
        <table class="table" aria-label="보관한 API">
          <thead>
            <tr>
              <th class="n">번호</th>
              <th class="name">API / 용도</th>
              <th class="usage">사용 프로젝트</th>
              <th class="count">키</th>
              <th class="expiry">가장 빠른 만료</th>
              <th class="open"></th>
            </tr>
          </thead>
          <tbody id="records"></tbody>
        </table>
        <div class="bottom-detail" id="bottom-detail"></div>
        <div class="list-end">
          <span id="result-count">8개 항목</span><span>날짜는 한국 시간 기준 · 만료일순</span>
        </div>
        <footer class="footer">
          <span>keydesk / 개인 API 키 보관함</span><span>Asia/Seoul</span>
        </footer>
      </main>
      <div class="toast" role="status" hidden></div>
    </div>
    <script>
      const entries = [
        {
          name: 'OpenAI',
          purpose: '문장 생성',
          projects: ['Pinmate'],
          keys: 2,
          expiry: '2026.11.13',
          days: 7,
        },
        {
          name: 'Anthropic',
          purpose: '코드 도우미',
          projects: ['Pinmate', 'Keydesk'],
          keys: 2,
          expiry: '',
          days: null,
        },
        {
          name: 'Kakao Maps',
          purpose: '장소 검색 · 지도',
          projects: ['Pinmate'],
          keys: 1,
          expiry: '2027.03.31',
          days: 145,
        },
        {
          name: 'Naver Search',
          purpose: '검색 데이터',
          projects: ['Pinmate'],
          keys: 1,
          expiry: '2026.11.04',
          days: -2,
        },
        {
          name: 'Google Cloud',
          purpose: '사진 속 글자 인식',
          projects: ['사진 정리'],
          keys: 2,
          expiry: '2026.12.01',
          days: 25,
        },
        {
          name: 'Supabase',
          purpose: '데이터베이스 · 인증',
          projects: ['Pinmate'],
          keys: 2,
          expiry: '',
          days: null,
        },
        {
          name: 'Resend',
          purpose: '만료 알림 메일',
          projects: ['Keydesk'],
          keys: 1,
          expiry: '2026.11.20',
          days: 14,
        },
        {
          name: 'Cloudflare',
          purpose: '도메인 관리',
          projects: ['홈서버'],
          keys: 1,
          expiry: '',
          days: null,
        },
      ];
      let selected = 0,
        layout = 'inline',
        filter = 'all',
        toastTimer;
      const timers = [];
      const app = document.querySelector('#app');
      function hideValues() {
        timers.forEach(clearTimeout);
        timers.length = 0;
        document
          .querySelectorAll('[data-value]')
          .forEach((node) => (node.textContent = '•••• •••• ••••'));
        document.querySelectorAll('[data-reveal]').forEach((node) => (node.textContent = '보기'));
      }
      function sheet(entry, id) {
        return `<section class="sheet" aria-label="${entry.name} 인증값"><header class="sheet-head"><${layout === 'split' ? 'strong' : 'span'}>${layout === 'split' ? entry.name : '인증값 ' + entry.keys + '개'}</${layout === 'split' ? 'strong' : 'span'}><div class="sheet-actions"><button type="button" data-info="항목 이름·용도·만료일을 수정하는 화면입니다.">항목 수정</button><button type="button" data-info="교체 일자와 이전 버전의 인증값을 확인합니다.">교체 기록</button></div></header><table class="key-table"><thead><tr><th class="label">키 이름</th><th class="value">인증값</th><th class="key-date">만료일</th><th class="key-actions"></th></tr></thead><tbody>${Array.from({ length: entry.keys }, (_, i) => `<tr><td class="label">${entry.keys === 1 ? 'API 키' : i === 0 ? '운영용' : '개발용'}</td><td class="value"><span class="masked" data-value="${id}-${i}">•••• •••• ••••</span></td><td class="key-date">${i === 0 ? entry.expiry || '미등록' : '미등록'}</td><td class="key-actions"><button type="button" data-reveal="${id}-${i}">보기</button><button type="button" data-info="예시 화면에는 실제 API 키가 없습니다.">복사</button></td></tr>`).join('')}</tbody></table><div class="sheet-note"><details><summary>요금제·주소·메모</summary><p>사용량별 과금 · 한도 메모 월 20달러</p><p>운영용과 개발용 키를 구분해 사용.</p></details><span>사용 프로젝트&nbsp; ${entry.projects.join(' · ')}</span></div></section>`;
      }
      function notify(text) {
        const box = document.querySelector('.toast');
        box.textContent = text;
        box.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (box.hidden = true), 3000);
      }
      function render() {
        hideValues();
        const query = document
            .querySelector('#search')
            .value.normalize('NFC')
            .toLocaleLowerCase('ko'),
          project = document.querySelector('#project').value;
        const visible = entries
          .map((entry, id) => ({ ...entry, id }))
          .filter(
            (entry) =>
              (project === 'all' || entry.projects.includes(project)) &&
              (filter === 'all' ||
                (filter === 'soon' && entry.days !== null && entry.days >= 0 && entry.days <= 30) ||
                (filter === 'expired' && entry.days !== null && entry.days < 0)) &&
              [entry.name, entry.purpose, ...entry.projects]
                .join(' ')
                .normalize('NFC')
                .toLocaleLowerCase('ko')
                .includes(query),
          )
          .sort((a, b) => (a.days ?? Infinity) - (b.days ?? Infinity));
        if (selected !== null && !visible.some((entry) => entry.id === selected))
          selected = visible.length ? visible[0].id : null;
        document.querySelector('#records').innerHTML = visible.length
          ? visible
              .map(
                (entry, index) =>
                  `<tr class="summary ${entry.id === selected ? 'selected' : ''} ${entry.days !== null && entry.days < 0 ? 'expired' : ''}"><td class="n">${String(index + 1).padStart(2, '0')}</td><td class="name"><button type="button" class="name-button" data-entry="${entry.id}" aria-expanded="${entry.id === selected}">${entry.name}</button><span class="entry-purpose">${entry.purpose}</span></td><td class="usage"><span class="use-name">${entry.projects.join(' · ')}</span></td><td class="count">${entry.keys}개</td><td class="expiry"><span class="date">${entry.expiry || '미등록'}</span><span class="remaining">${entry.days === null ? '만료일 미등록' : entry.days < 0 ? -entry.days + '일 전 만료' : entry.days + '일 남음'}</span></td><td class="open"><button type="button" data-entry="${entry.id}" aria-label="${entry.name} ${entry.id === selected ? '닫기' : '열기'}">${entry.id === selected ? '−' : '+'}</button></td></tr>${entry.id === selected && layout === 'inline' ? `<tr class="detail-row"><td colspan="6">${sheet(entry, entry.id)}</td></tr>` : ''}`,
              )
              .join('')
          : '<tr><td colspan="6" class="empty">조건에 맞는 항목이 없습니다.</td></tr>';
        document.querySelector('#bottom-detail').innerHTML =
          selected !== null && layout === 'split' ? sheet(entries[selected], selected) : '';
        document.querySelector('#result-count').textContent =
          `${visible.length}개 항목 · 인증값 ${visible.reduce((n, entry) => n + entry.keys, 0)}개`;
        document.querySelectorAll('[data-entry]').forEach((button) =>
          button.addEventListener('click', () => {
            const id = Number(button.dataset.entry);
            selected = selected === id ? null : id;
            render();
          }),
        );
        document
          .querySelectorAll('[data-info]')
          .forEach((button) => button.addEventListener('click', () => notify(button.dataset.info)));
        document.querySelectorAll('[data-reveal]').forEach((button) =>
          button.addEventListener('click', () => {
            const node = document.querySelector(`[data-value="${button.dataset.reveal}"]`);
            if (button.textContent === '숨김') {
              node.textContent = '•••• •••• ••••';
              button.textContent = '보기';
              return;
            }
            node.textContent = '시안용 인증값';
            button.textContent = '숨김';
            timers.push(
              setTimeout(() => {
                node.textContent = '•••• •••• ••••';
                button.textContent = '보기';
              }, 20000),
            );
          }),
        );
      }
      document.querySelectorAll('[data-layout]').forEach((button) =>
        button.addEventListener('click', () => {
          layout = button.dataset.layout;
          app.classList.toggle('split', layout === 'split');
          document
            .querySelectorAll('[data-layout]')
            .forEach((node) => node.classList.toggle('active', node === button));
          if (selected === null) selected = 0;
          render();
        }),
      );
      document.querySelectorAll('[data-filter]').forEach((button) =>
        button.addEventListener('click', () => {
          filter = button.dataset.filter;
          document
            .querySelectorAll('[data-filter]')
            .forEach((node) => node.classList.toggle('active', node === button));
          render();
        }),
      );
      document
        .querySelectorAll('[data-demo]')
        .forEach((button) => button.addEventListener('click', () => notify(button.dataset.demo)));
      document.querySelector('#project').addEventListener('change', render);
      document.querySelector('#search').addEventListener('input', render);
      document.querySelector('#lock').addEventListener('click', () => {
        hideValues();
        notify('시안에서 펼쳐 본 인증값을 숨겼습니다.');
      });
      document.addEventListener('keydown', (event) => {
        if (event.isComposing) return;
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
          event.preventDefault();
          document.querySelector('#search').focus();
        }
        if (event.key === 'Escape') {
          selected = null;
          hideValues();
          render();
        }
      });
      window.addEventListener('blur', hideValues);
      if (/Mac|iPhone|iPad/.test(navigator.platform))
        document.querySelector('#shortcut').textContent = '⌘ K';
      render();
    </script>
  </body>
</html>
